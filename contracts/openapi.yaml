      type: object
      additionalProperties: false
      properties:
        ids: { type: array, items: { type: string } }
    MarkReadResult:
      type: object
      required: [marked]
      properties:
        marked: { type: integer }
    IntegrationStatus:
      type: object
      required: [id, label, status, reason, checkedAt]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, unavailable, disabled] }
        reason: { type: string }
        checkedAt: { type: [string, 'null'], format: date-time }
