    SceneSummary:
      type: object
      required: [id, name, schemaVersion, demo, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schemaVersion: { type: integer }
        demo: { type: boolean }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SceneRecord:
      type: object
      required: [id, name, schemaVersion, demo, revision, createdAt, updatedAt, document]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schemaVersion: { type: integer }
        demo: { type: boolean }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        document: { $ref: 'scene.schema.json' }
    SceneReplaceRequest:
      type: object
      required: [revision, document]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        document: { $ref: 'scene.schema.json' }
    MetricType:
      type: object
      required: [id, label, unit, description, labelKey, key]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        description: { type: string }
        labelKey: { type: string }
        key: { type: boolean }
    MetricValue:
      type: object
      required: [metric, label, value, unit, at, source, quality, reason]
      properties:
        metric: { type: string }
        label: { type: string }
