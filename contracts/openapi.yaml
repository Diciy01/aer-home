        n8nInstanceId: { type: string }
        n8nWorkflowIds: { type: array, items: { type: string } }
        telegramTokenId: { type: string, description: id of a token file declared in Core config (never the token) }
        container: { type: string }
        heartbeatIntervalSec: { type: integer }
        heartbeatTimeoutSec: { type: integer }
        logSource: { type: string, enum: [heartbeat, controller, docker, n8n, none] }
        notes: { type: string }
        revision: { type: integer, description: bot config revision (optimistic locking) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        archived: { type: boolean }
        entityRevision: { type: integer }
        host: { oneOf: [{ $ref: '#/components/schemas/BotEntityRef' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/MonitoringStatus' }
        statusReason: { type: string }
        lastContactAt: { type: [string, 'null'], format: date-time }
        openIncidents: { type: integer }
        heartbeat: { $ref: '#/components/schemas/BotHeartbeat' }
        version: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        uptimeSec: { type: [integer, 'null'] }
        lastError: { type: string }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        apiOk: { type: [boolean, 'null'] }
        cpuPercent: { type: [number, 'null'] }
        memBytes: { type: [number, 'null'] }
        runtimeState: { oneOf: [{ $ref: '#/components/schemas/BotRuntimeState' }, { type: 'null' }] }
        lastJobOk: { oneOf: [{ $ref: '#/components/schemas/BotJob' }, { type: 'null' }] }
        lastJobFailed: { oneOf: [{ $ref: '#/components/schemas/BotJob' }, { type: 'null' }] }
        jobs: { $ref: '#/components/schemas/BotJobCounts' }
    BotDetail:
      type: object
      required: [entityId, name, status, dependencies, crashes, restarts, actions, integration]
      properties:
        entityId: { type: string, format: uuid }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        category: { type: string }
        controllerId: { type: string, description: id of a controller declared in Core config; empty = monitoring only }
        n8nInstanceId: { type: string }
        n8nWorkflowIds: { type: array, items: { type: string } }
        telegramTokenId: { type: string, description: id of a token file declared in Core config (never the token) }
        container: { type: string }
        heartbeatIntervalSec: { type: integer }
        heartbeatTimeoutSec: { type: integer }
        logSource: { type: string, enum: [heartbeat, controller, docker, n8n, none] }
        notes: { type: string }
        revision: { type: integer, description: bot config revision (optimistic locking) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        archived: { type: boolean }
        entityRevision: { type: integer }
        host: { oneOf: [{ $ref: '#/components/schemas/BotEntityRef' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/MonitoringStatus' }
        statusReason: { type: string }
        lastContactAt: { type: [string, 'null'], format: date-time }
        openIncidents: { type: integer }
        heartbeat: { $ref: '#/components/schemas/BotHeartbeat' }
        version: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        uptimeSec: { type: [integer, 'null'] }
        lastError: { type: string }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        apiOk: { type: [boolean, 'null'] }
        cpuPercent: { type: [number, 'null'] }
        memBytes: { type: [number, 'null'] }
        runtimeState: { oneOf: [{ $ref: '#/components/schemas/BotRuntimeState' }, { type: 'null' }] }
        lastJobOk: { oneOf: [{ $ref: '#/components/schemas/BotJob' }, { type: 'null' }] }
        lastJobFailed: { oneOf: [{ $ref: '#/components/schemas/BotJob' }, { type: 'null' }] }
        jobs: { $ref: '#/components/schemas/BotJobCounts' }
        dependencies: { type: array, items: { $ref: '#/components/schemas/BotEntityRef' } }
        crashes: { type: array, items: { $ref: '#/components/schemas/Incident' }, description: availability/process/container/n8n incidents }
        restarts: { type: array, items: { $ref: '#/components/schemas/MonitoringEvent' } }
        actions: { type: array, items: { $ref: '#/components/schemas/BotAction' } }
        integration: { oneOf: [{ $ref: '#/components/schemas/BotIntegration' }, { type: 'null' }] }
    BotIntegration:
      type: object
      required: [kind, label, status, reason, checkedAt]
      properties:
        kind: { type: string, enum: [n8n, telegram] }
        label: { type: string }
        status: { type: string, enum: [ok, unavailable, disabled, unknown] }
        reason: { type: string }
        checkedAt: { type: [string, 'null'], format: date-time }
        workflows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              active: { type: boolean }
    NewBot:
      type: object
      additionalProperties: false
      description: "Either entityId (link an existing entity) or name+type (create one)"
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [telegram_bot, process, service, automation, application, docker_container] }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        hostId: { type: string, format: uuid, description: creates a runs_on relation }
        dependsOn: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        category: { type: string, maxLength: 40 }
        controllerId: { type: string }
        n8nInstanceId: { type: string }
        n8nWorkflowIds: { type: array, items: { type: string } }
        telegramTokenId: { type: string }
        container: { type: string }
        heartbeatIntervalSec: { type: integer, minimum: 5, maximum: 3600 }
        heartbeatTimeoutSec: { type: integer, minimum: 10, maximum: 86400 }
        logSource: { type: string, enum: [heartbeat, controller, docker, n8n, none] }
        notes: { type: string, maxLength: 1000 }
        createCredential: { type: boolean }
    BotPatch:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        hostId: { type: string, description: empty string removes the runs_on relation }
        dependsOn: { type: array, items: { type: string, format: uuid } }
        runtime: { $ref: '#/components/schemas/BotRuntime' }
        category: { type: string }
        controllerId: { type: string }
        n8nInstanceId: { type: string }
        n8nWorkflowIds: { type: array, items: { type: string } }
        telegramTokenId: { type: string }
        container: { type: string }
        heartbeatIntervalSec: { type: integer }
        heartbeatTimeoutSec: { type: integer }
        logSource: { type: string }
        notes: { type: string }
    CreatedBot:
      type: object
      required: [bot]
      properties:
        bot: { $ref: '#/components/schemas/BotDetail' }
        heartbeatToken: { type: string, description: shown once; store it in a 0600 file for the bot }
    BotAction:
      type: object
      required: [id, label, available, reason, confirm, risk]
      properties:
        id: { type: string, enum: [start, stop, restart, check, job.retry] }
        label: { type: string }
        available: { type: boolean }
        reason: { type: string }
        confirm: { type: boolean }
        risk: { type: string }
    BotConfirmRequest:
      type: object
      additionalProperties: false
      properties:
        jobId: { type: string, description: for job.retry }
    BotConfirmation:
      type: object
      required: [token, entityId, action, summary, risks, expiresAt]
      properties:
        token: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        jobId: { type: string }
        summary: { type: string }
        risks: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    BotActionRequest:
      type: object
      additionalProperties: false
      properties:
        confirmationToken: { type: string, description: required for every action except check }
        jobId: { type: string }
    BotActionRecord:
      type: object
      required: [id, entityId, action, jobId, adapter, status, message, idempotencyKey, requestedAt, finishedAt, replayed]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        action: { type: string }
        jobId: { type: string }
        adapter: { type: string }
        status: { type: string, enum: [running, succeeded, failed, rejected] }
        message: { type: string }
        idempotencyKey: { type: string }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        replayed: { type: boolean }
    BotAdapter:
      type: object
      required: [id, label, description, capabilities, status, reason, instances]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string, enum: [monitor, logs, control, jobs, retry, check] } }
        status: { type: string, enum: [ok, unavailable, disabled] }
        reason: { type: string }
        instances:
          type: array
          items:
            type: object
            required: [id, label, target]
            properties:
              id: { type: string }
              label: { type: string }
              target: { type: string }
              allow: { type: array, items: { type: string } }
              usedBy: { type: string }
    BotJobReport:
      type: object
      additionalProperties: false
      properties:
        jobs:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, name, status]
            properties:
              id: { type: string, maxLength: 80, description: the bot's own job id; repeated reports update the job }
              name: { type: string, maxLength: 120 }
              status: { $ref: '#/components/schemas/BotJobStatus' }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time }
              result: { type: string }
              error: { type: string }
    RemoteState: { type: string, enum: [pending, awaiting_approval, connecting, connected, reconnecting, disconnected, failed, expired, revoked] }
    RemoteCaps:
      type: object
      required: [desktop, input, clipboard, files, apps]
      properties:
        desktop: { type: boolean }
        input: { type: boolean }
        clipboard: { type: boolean }
        files: { type: boolean }
        apps: { type: boolean, description: single-application isolation; no current backend provides it }
    RemoteHostInfo:
      type: object
      additionalProperties: false
      required: [backend, address, port, approval]
      properties:
        os: { type: string }
        osVersion: { type: string }
        hostname: { type: string }
        version: { type: string }
        backend: { type: string, enum: [gnome-rdp, windows-rdp] }
        transport: { type: string, enum: [rdp] }
        address: { type: string, description: address the client connects to (LAN/VPN) }
        port: { type: integer }
        certPem: { type: string, description: public TLS certificate of the RDP server, pinned by clients }
        filesPort: { type: integer }
        monitors: { type: integer }
        capabilities: { $ref: '#/components/schemas/RemoteCaps' }
        approval: { type: string, enum: [auto, prompt] }
        ready: { type: boolean }
        reason: { type: string }
        username: { type: string }
    RemotePolicy:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        desktop: { type: boolean }
        clipboard: { type: boolean }
        files: { type: boolean }
        maxMinutes: { type: integer, minimum: 5 }
        revision: { type: integer }
    RemoteEvent:
      type: object
      required: [at, kind, message]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string }
    RemoteSession:
      type: object
      required: [id, entityId, hostName, kind, sourceName, sourceEntityId, clientId, transport, state, reason, allowed, createdAt,
        approvedAt, readyAt, grantedAt, connectedAt, endedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        hostName: { type: string }
        kind: { type: string, enum: [desktop, app] }
        sourceName: { type: string }
        sourceEntityId: { type: string }
        clientId: { type: string }
        transport: { type: string }
        state: { $ref: '#/components/schemas/RemoteState' }
        reason: { type: string }
        allowed: { $ref: '#/components/schemas/RemoteCaps' }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        grantedAt: { type: [string, 'null'], format: date-time }
        connectedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/RemoteEvent' } }
    RemoteHost:
      type: object
      required: [entityId, name, type, archived, declaredCapabilities, agent, agentActive, lastHelloAt, certSha256, policy, effective,
        canConnect, reason, status, statusReason, lastContactAt, activeSession, lastSession]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        archived: { type: boolean }
        declaredCapabilities: { type: array, items: { type: string } }
        agent: { oneOf: [{ $ref: '#/components/schemas/RemoteHostInfo' }, { type: 'null' }] }
        agentActive: { type: boolean }
        lastHelloAt: { type: [string, 'null'], format: date-time }
        certSha256: { type: string }
        policy: { $ref: '#/components/schemas/RemotePolicy' }
        effective: { $ref: '#/components/schemas/RemoteCaps' }
        canConnect: { type: boolean }
        reason: { type: string, description: why connecting is not possible now }
        status: { $ref: '#/components/schemas/MonitoringStatus' }
        statusReason: { type: string }
        lastContactAt: { type: [string, 'null'], format: date-time }
        activeSession: { oneOf: [{ $ref: '#/components/schemas/RemoteSession' }, { type: 'null' }] }
        lastSession: { oneOf: [{ $ref: '#/components/schemas/RemoteSession' }, { type: 'null' }] }
    RemoteNewSession:
      type: object
      additionalProperties: false
      required: [entityId]
      properties:
        entityId: { type: string, format: uuid }
        kind: { type: string, enum: [desktop, app] }
        sourceName: { type: string, maxLength: 120 }
        sourceEntityId: { type: string }
        clientId: { type: string, maxLength: 80 }
        minutes: { type: integer, minimum: 1 }
        clipboard: { type: boolean }
        files: { type: boolean }
    RemoteGrant:
      type: object
      required: [sessionId, transport, route, host, port, username, password, certPem, certSha256, clipboard, files, tunnel, expiresAt, externalClient]
      properties:
        sessionId: { type: string, format: uuid }
        transport: { type: string }
        route: { type: string, enum: [direct, relay], description: "direct: host address in the LAN (M07); relay: through the Remote Gateway with one-time tunnel tickets (ADR-017)" }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string, description: one-time session password; empty for Windows hosts (OS account) }
        certPem: { type: string }
        certSha256: { type: string }
        clipboard: { type: boolean }
        files:
          oneOf:
            - type: 'null'
            - type: object
              required: [url, token, maxBytes]
              properties:
                url: { type: string }
                token: { type: string }
                maxBytes: { type: integer }
        tunnel:
          oneOf:
            - type: 'null'
            - type: object
              required: [path, tickets, ttlSec]
              properties:
                path: { type: string }
                tickets: { type: object, additionalProperties: { type: string }, description: "channel (rdp, files) → one-time ticket" }
                ttlSec: { type: integer }
        expiresAt: { type: string, format: date-time }
        externalClient: { type: string }
    RemoteApps:
      type: object
      required: [status, reason, apps]
      properties:
        status: { type: string, enum: [unsupported, available] }
        reason: { type: string }
        apps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
    RemoteCommand:
      type: object
      required: [id, type, sessionId, expiresAt, allowed]
      properties:
        id: { type: string }
        type: { type: string, enum: [open, close] }
        sessionId: { type: string }
        expiresAt: { type: string, format: date-time }
        allowed: { $ref: '#/components/schemas/RemoteCaps' }
        reason: { type: string }
    RemoteAgentEvent:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { type: string, enum: [awaiting_approval, approved, denied, ready, connected, disconnected, closed, failed] }
        password: { type: string, description: only with ready; kept in Core memory until the one-time grant }
        filesToken: { type: string }
        message: { type: string }
    PowerJobState: { type: string, enum: [queued, sent, waiting, succeeded, failed, timeout, cancelled, simulated, rejected] }
    PowerWoLTarget:
      type: object
      additionalProperties: false
      required: [mac]
      properties:
        mac: { type: string, description: "unicast MAC; aa:bb:cc:dd:ee:ff, aa-bb-…, aabb.ccdd.eeff or 12 hex digits" }
        broadcast: { type: string, description: "IPv4 LAN destination; default 255.255.255.255" }
        interface: { type: string, description: "Core's interface to send from (optional)" }
        port: { type: integer, description: "0 = power.wol.port" }
    PowerPolicy:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        wake: { type: boolean }
        shutdown: { type: boolean }
        reboot: { type: boolean }
        suspend: { type: boolean }
        switchOs: { type: boolean, description: off by default }
        allowWithBitLocker: { type: boolean }
        revision: { type: integer }
    PowerBootEntry:
      type: object
      required: [id, label, os, current]
      properties:
        id: { type: string, description: "UEFI Boot#### (4 hex digits) or Windows firmware {GUID}" }
        label: { type: string }
        os: { type: string, enum: [linux, windows, bootmanager, other] }
        current: { type: boolean }
    PowerCapability:
      type: object
      required: [supported, reason]
      properties:
        supported: { type: boolean }
        reason: { type: string }
    PowerHostInfo:
      type: object
      additionalProperties: false
      required: [os, firmware, secureBoot, bitlocker]
      properties:
        os: { type: string, enum: [linux, windows] }
        osVersion: { type: string }
        hostname: { type: string }
        version: { type: string }
        bootId: { type: string, description: changes on every boot }
        dryRun: { type: boolean, description: "check mode: the agent executes nothing (default)" }
        firmware: { type: string, enum: [uefi, bios, unknown] }
        secureBoot: { type: string, enum: [enabled, disabled, unknown] }
        bitlocker: { type: string, enum: ['off', 'on', unknown, n/a] }
        bootManager: { type: string }
        bootEntries: { type: [array, 'null'], items: { $ref: '#/components/schemas/PowerBootEntry' } }
        macs: { type: [array, 'null'], items: { type: string } }
        actions:
          type: [object, 'null']
          description: "keys shutdown, reboot, suspend, bootNext"
          additionalProperties: { $ref: '#/components/schemas/PowerCapability' }
    PowerAgent:
      type: object
      required: [agentId, name, active, lastHelloAt, info]
      properties:
        agentId: { type: string }
        name: { type: string }
        active: { type: boolean }
        lastHelloAt: { type: string, format: date-time }
        info: { $ref: '#/components/schemas/PowerHostInfo' }
    PowerTarget:
      type: object
      required: [os, label, entryId, available, reason]
      properties:
        os: { type: string, enum: [linux, windows] }
        label: { type: string }
        entryId: { type: string }
        available: { type: boolean }
        reason: { type: string }
    PowerAction:
      type: object
      required: [id, label, available, reason, dangerous]
      properties:
        id: { type: string, enum: [wake, shutdown, reboot, suspend, switch_os, check] }
        label: { type: string }
        available: { type: boolean }
        reason: { type: string }
        dangerous: { type: boolean }
        targets: { type: array, items: { $ref: '#/components/schemas/PowerTarget' } }
    PowerEvent:
      type: object
      required: [at, kind, message]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string }
    PowerJob:
      type: object
      required: [id, entityId, deviceName, action, targetOs, bootEntryId, state, message, replayed, simulated, fromOs, requestedAt,
        sentAt, finishedAt, deadline]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        deviceName: { type: string }
        action: { type: string, enum: [wake, shutdown, reboot, suspend, switch_os, check] }
        targetOs: { type: string }
        bootEntryId: { type: string }
        state: { $ref: '#/components/schemas/PowerJobState' }
        message: { type: string }
        replayed: { type: boolean }
        simulated: { type: boolean, description: "true when the agent ran in check mode (SIMULATED)" }
        fromOs: { type: string }
        requestedAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        deadline: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/PowerEvent' } }
    PowerDevice:
      type: object
      required: [entityId, name, type, declaredCapabilities, state, stateReason, currentOs, lastContactAt, monitoringStatus, wol,
        sameMachineAsCore, sameMachineNote, agents, policy, actions, activeJob, lastJob]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        declaredCapabilities: { type: array, items: { type: string } }
        state: { type: string, enum: [online, offline, waking, shutting_down, rebooting, switching, suspending, unknown] }
        stateReason: { type: string }
        currentOs: { type: string }
        lastContactAt: { type: [string, 'null'], format: date-time }
        monitoringStatus: { type: string, description: Monitoring's observation (empty when unknown) }
        wol: { oneOf: [{ $ref: '#/components/schemas/PowerWoLTarget' }, { type: 'null' }] }
        sameMachineAsCore: { type: boolean, description: "Core runs on this computer: it cannot wake itself" }
        sameMachineNote: { type: string }
        agents: { type: array, items: { $ref: '#/components/schemas/PowerAgent' } }
        policy: { $ref: '#/components/schemas/PowerPolicy' }
        actions: { type: array, items: { $ref: '#/components/schemas/PowerAction' } }
        activeJob: { oneOf: [{ $ref: '#/components/schemas/PowerJob' }, { type: 'null' }] }
        lastJob: { oneOf: [{ $ref: '#/components/schemas/PowerJob' }, { type: 'null' }] }
    PowerCheck:
      type: object
      required: [name, ok, message]
      properties:
        name: { type: string }
        ok: { type: boolean }
        message: { type: string }
    PowerConfirmation:
      type: object
      required: [token, entityId, action, targetOs, summary, risks, checks, expiresAt]
      properties:
        token: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        targetOs: { type: string }
        summary: { type: string }
        risks: { type: array, items: { type: string } }
        checks: { type: array, items: { $ref: '#/components/schemas/PowerCheck' } }
        expiresAt: { type: string, format: date-time }
    PowerActionRequest:
      type: object
      additionalProperties: false
      properties:
        confirmationToken: { type: string, description: required for every action except check }
        targetOs: { type: string, enum: [linux, windows], description: switch_os only }
    PowerInterface:
      type: object
      required: [name, mac, addresses, broadcasts, up, loopback]
      properties:
        name: { type: string }
        mac: { type: string }
        addresses: { type: array, items: { type: string } }
        broadcasts: { type: array, items: { type: string } }
        up: { type: boolean }
        loopback: { type: boolean }
    PowerCommand:
      type: object
      required: [id, jobId, action, expiresAt]
      properties:
        id: { type: string }
        jobId: { type: string, description: empty for inventory refresh }
        action: { type: string, enum: [shutdown, reboot, suspend, switch_os, inventory] }
        entryId: { type: string, description: "switch_os: boot entry the agent itself reported" }
        targetOs: { type: string }
        expiresAt: { type: string, format: date-time }
    PowerAgentEvent:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [accepted, executing, simulated, failed] }
        message: { type: string }
    NetworkStatus: { type: string, enum: [up, down, error, unconfigured, unknown] }
    NetworkTarget:
      type: object
      required: [target, ok, latencyMs, error]
      properties:
        target: { type: string }
        ok: { type: boolean }
        latencyMs: { type: [number, 'null'] }
        error: { type: string }
    NetworkDetails:
      type: object
      properties:
        targets: { type: array, items: { $ref: '#/components/schemas/NetworkTarget' } }
        connection: { type: string, description: "UPnP NewConnectionStatus" }
        physicalLink: { type: string }
        uptimeSec: { type: integer }
        downMbps: { type: number }
        upMbps: { type: number }
        streaming: { type: boolean, description: "Sunshine state is *_BUSY" }
        version: { type: string }
        currentApp: { type: integer }
        webReachable: { type: boolean }
    NetworkCheck:
      type: object
      required: [key, kind, name, entityId, status, reason, latencyMs, lastCheckAt, lastOkAt, changedAt, failures, stale, details]
      properties:
        key: { type: string }
        kind: { type: string, enum: [internet, router_wan, sunshine] }
        name: { type: string }
        entityId: { type: string }
        status: { $ref: '#/components/schemas/NetworkStatus' }
        reason: { type: string }
        latencyMs: { type: [number, 'null'] }
        lastCheckAt: { type: [string, 'null'], format: date-time }
        lastOkAt: { type: [string, 'null'], format: date-time }
        changedAt: { type: [string, 'null'], format: date-time }
        failures: { type: integer }
        stale: { type: boolean }
        details: { oneOf: [{ $ref: '#/components/schemas/NetworkDetails' }, { type: 'null' }] }
    NetworkDevice:
      type: object
      required: [entityId, name, type, address, status, reason, monitoringStatus, latencyMs, latencyAt, lastContactAt, lastCheckAt, changedAt, stale, openIncidents]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        address: { type: string }
        status: { $ref: '#/components/schemas/NetworkStatus' }
        reason: { type: string }
        monitoringStatus: { type: string }
        latencyMs: { type: [number, 'null'] }
        latencyAt: { type: [string, 'null'], format: date-time }
        lastContactAt: { type: [string, 'null'], format: date-time }
        lastCheckAt: { type: [string, 'null'], format: date-time }
        changedAt: { type: [string, 'null'], format: date-time }
        stale: { type: boolean }
        openIncidents: { type: integer }
    NetworkRouter:
      type: object
      required: [device, adapter, adapterNote, wan]
      properties:
        device: { $ref: '#/components/schemas/NetworkDevice' }
        adapter: { type: string, enum: [upnp, none] }
        adapterNote: { type: string }
        wan: { oneOf: [{ $ref: '#/components/schemas/NetworkCheck' }, { type: 'null' }] }
    NetworkSunshine:
      type: object
      required: [id, name, webUrl, check, entity, tv]
      properties:
        id: { type: string }
        name: { type: string }
        webUrl: { type: string }
        check: { $ref: '#/components/schemas/NetworkCheck' }
        entity: { oneOf: [{ $ref: '#/components/schemas/NetworkDevice' }, { type: 'null' }] }
        tv: { oneOf: [{ $ref: '#/components/schemas/NetworkDevice' }, { type: 'null' }] }
    NetworkOverview:
      type: object
      required: [summary, internet, routers, devices, tvs, sunshine, incidents, recent, intervalSec, generatedAt]
      properties:
        summary:
          type: object
          required: [level, title, issues]
          properties:
            level: { type: string, enum: [ok, warning, critical, unconfigured] }
            title: { type: string }
            issues: { type: array, items: { type: string } }
        internet: { $ref: '#/components/schemas/NetworkCheck' }
