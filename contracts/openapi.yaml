openapi: 3.1.0
info:
  title: AER HOME Core API
  version: 0.6.0
  description: >
    Core REST contract. Operations carry `x-aer-status`: `implemented` operations are
    served by aer-core and checked by core/internal/core/contract_test.go; `planned`
    operations are drafts for later milestones and may change.
    Every response uses the envelope from ADR-007: `{data, meta}` on success,
    `{error, meta}` on failure.
    Changelog: 0.2.0 — response envelope, error model, public /health, /system/info (M01).
    0.3.0 — Registry module under /registry (M02); draft /entities paths and the draft
    Entity/NewEntity schemas are replaced by RegistryEntity (no status field: health
    belongs to Monitoring). See docs/adr/ADR-008-registry-model.md.
    0.4.0 — Scene storage under /scenes (M03); documents follow contracts/scene.schema.json v1.
    See docs/adr/ADR-009-scene-engine.md.
    0.5.0 — Scene editor (M04): room style materials are data-defined ids (pattern instead of
    enum), optional `style.light`; additive, every 0.4.0 document stays valid.
    See docs/adr/ADR-010-scene-editor.md.
    0.6.0 — Monitoring (M05) under /monitoring: states, metric history, logs, events, incidents,
    notifications, agent credentials, Docker; agent protocol POST /monitoring/agent/report with
    per-agent credentials (agentAuth). The draft /incidents path and Incident schema are replaced.
    See docs/adr/ADR-011-monitoring.md.
servers:
  - url: http://127.0.0.1:8787/api/v1
    description: Local development Core (loopback only)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      x-aer-status: implemented
      summary: Core liveness and storage readiness
      description: >
        Public so clients can tell "Core offline" from "token rejected".
        Returns no identifiers or data. `degraded` means the database did not answer.
      security: []
      responses:
        '200':
          description: Core is serving requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Health' }
  /system/info:
    get:
      x-aer-status: implemented
      summary: Core version, mode, schema versions and module states
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /registry/types:
    get:
      x-aer-status: implemented
      summary: Entity type catalog (drives the add wizard)
      responses:
        '200': { $ref: '#/components/responses/EntityTypeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /registry/capabilities:
    get:
      x-aer-status: implemented
      summary: Capability catalog
      responses:
        '200': { $ref: '#/components/responses/CapabilityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /registry/relation-kinds:
    get:
      x-aer-status: implemented
      summary: Relation kind catalog
      responses:
        '200': { $ref: '#/components/responses/RelationKindList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /registry/entities:
    get:
      x-aer-status: implemented
      summary: List entities with search, filters and pagination (sorted by name)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive search in name, description, address, tags; all words must match }
        - { name: type, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: tag, in: query, schema: { type: string } }
        - { name: capability, in: query, schema: { type: string } }
        - { name: parentId, in: query, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { type: string, enum: ['false', 'true', all], default: 'false' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: One page of entities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegistryEntityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      x-aer-status: implemented
      summary: Register an entity; only name and type are required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRegistryEntity' }
      responses:
        '201': { $ref: '#/components/responses/Entity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /registry/entities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      x-aer-status: implemented
      summary: Read an entity (archived entities included)
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      x-aer-status: implemented
      summary: Change fields; requires the current revision (optimistic locking)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryEntityPatch' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /registry/entities/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      x-aer-status: implemented
      summary: Archive (soft-delete) an entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registry/entities/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      x-aer-status: implemented
      summary: Restore an archived entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registry/entities/{id}/capabilities:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      x-aer-status: implemented
      summary: Replace declared capabilities (Registry declares; other modules execute)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilitiesRequest' }
      responses:
        '200': { $ref: '#/components/responses/Entity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /registry/entities/{id}/relations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      x-aer-status: implemented
      summary: Outgoing and incoming relations with peer summaries
      responses:
        '200':
          description: Relations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RelationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      x-aer-status: implemented
      summary: Add a relation from this entity; acyclic kinds reject cycles (409 reason=cycle)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRelation' }
      responses:
        '201':
          description: Created relation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Relation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /registry/relations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      x-aer-status: implemented
      summary: Remove a relation (entities are untouched)
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenes:
    get:
      x-aer-status: implemented
      summary: List stored scenes (most recently updated first)
      responses:
        '200':
          description: Scene summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SceneSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      x-aer-status: implemented
      summary: Store a new scene document (sceneId becomes the scene id)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'scene.schema.json' }
      responses:
        '201': { $ref: '#/components/responses/Scene' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /scenes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      x-aer-status: implemented
      summary: Read a scene with its document
      responses:
        '200': { $ref: '#/components/responses/Scene' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      x-aer-status: implemented
      summary: Replace the document; requires the current revision (previous revision kept in history)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SceneReplaceRequest' }
      responses:
        '200': { $ref: '#/components/responses/Scene' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /monitoring/overview:
    get:
      x-aer-status: implemented
      summary: "Monitoring summary: devices by status, incidents, integrations, recent events"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MonitoringOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/metric-types:
    get:
      x-aer-status: implemented
      summary: "Catalog of accepted metrics (agents may not invent names)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/MetricType' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/states:
    get:
      x-aer-status: implemented
      summary: "Current state of every active Registry entity"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DeviceState' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/states/{entityId}:
    get:
      x-aer-status: implemented
      summary: "State of one entity with all latest metrics and its agents"
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string }, description: "Registry entity UUID" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeviceState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /monitoring/states/{entityId}/history:
    get:
      x-aer-status: implemented
      summary: "Metric history: raw for short recent ranges, 5-minute aggregates otherwise; gaps are null"
      parameters:
        - { name: entityId, in: path, required: true, schema: { type: string }, description: "Registry entity UUID" }
        - { name: metric, in: query, required: true, schema: { type: string }, description: "Metric id" }
        - { name: label, in: query, required: false, schema: { type: string }, description: "Series label (mount, iface…)" }
        - { name: from, in: query, required: false, schema: { type: string }, description: "RFC 3339, default to−1h" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "RFC 3339, default now" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MetricSeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /monitoring/logs:
    get:
      x-aer-status: implemented
      summary: "Search centralized logs (newest first, cursor pagination)"
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Words in message or source" }
        - { name: entityId, in: query, required: false, schema: { type: string }, description: "" }
        - { name: source, in: query, required: false, schema: { type: string }, description: "Source prefix" }
        - { name: level, in: query, required: false, schema: { type: string }, description: "Minimum level" }
        - { name: incidentId, in: query, required: false, schema: { type: string }, description: "" }
        - { name: from, in: query, required: false, schema: { type: string }, description: "RFC 3339" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "RFC 3339" }
        - { name: before, in: query, required: false, schema: { type: integer }, description: "Cursor: ids below" }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "1…500" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LogPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /monitoring/logs/{id}:
    get:
      x-aer-status: implemented
      summary: "One log entry"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "Log id" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /monitoring/events:
    get:
      x-aer-status: implemented
      summary: "Event history (state changes, incidents, integrations)"
      parameters:
        - { name: entityId, in: query, required: false, schema: { type: string }, description: "" }
        - { name: before, in: query, required: false, schema: { type: integer }, description: "" }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/MonitoringEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/incidents:
    get:
      x-aer-status: implemented
      summary: "List incidents (active first, then by severity)"
      parameters:
        - { name: status, in: query, required: false, schema: { type: string }, description: "active | open | acknowledged | resolved" }
        - { name: severity, in: query, required: false, schema: { type: string }, description: "info | warning | critical" }
        - { name: entityId, in: query, required: false, schema: { type: string }, description: "" }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "" }
        - { name: offset, in: query, required: false, schema: { type: integer }, description: "" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IncidentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /monitoring/incidents/{id}:
    get:
      x-aer-status: implemented
      summary: "One incident with its timeline"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Incident UUID" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /monitoring/incidents/{id}/acknowledge:
    post:
      x-aer-status: implemented
      summary: "Acknowledge an open incident (it still resolves automatically on recovery)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Incident UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcknowledgeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /monitoring/notifications:
    get:
      x-aer-status: implemented
      summary: "Notification center (newest first)"
      parameters:
        - { name: unread, in: query, required: false, schema: { type: boolean }, description: "" }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: "" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/notifications/read:
    post:
      x-aer-status: implemented
      summary: "Mark notifications read (all when ids is empty)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarkReadResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /monitoring/agents:
    get:
      x-aer-status: implemented
      summary: "Agent and bot heartbeat credentials (no secrets)"
      parameters:
        - { name: entityId, in: query, required: false, schema: { type: string }, description: "" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      x-aer-status: implemented
      summary: "Create a credential bound to one entity; the token is returned once"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAgent' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreatedAgent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /monitoring/agents/{id}/revoke:
    post:
      x-aer-status: implemented
      summary: "Revoke an agent credential immediately"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Agent UUID" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /monitoring/docker/containers:
    get:
      x-aer-status: implemented
      summary: "Last known Docker containers and whether Docker answers now (read-only)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContainerList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /monitoring/agent/report:
    post:
      x-aer-status: implemented
      summary: "Agent protocol v1: heartbeat + metrics + logs. Agent credential only; the entity comes from the credential"
      security:
        - agentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentReport' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    agentAuth:
      type: http
      scheme: bearer
      description: Per-agent credential (aer1.<agentId>.<secret>) bound to one Registry entity; revocable. Never the owner token.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource or endpoint not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Malformed JSON, unknown fields or oversized body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: "VALIDATION_FAILED; error.details.fields maps field name to a human-readable message"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: "CONFLICT; error.details.reason is revision_mismatch | archived | state | duplicate | cycle, error.details.currentRevision when known"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Entity:
      description: The entity
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/RegistryEntity' }
    Scene:
      description: The scene with its document
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SceneRecord' }
    EntityTypeList:
      description: Entity types
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EntityType' } }
    CapabilityList:
      description: Capabilities
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    RelationKindList:
      description: Relation kinds
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RelationKind' } }
  schemas:
    Meta:
      type: object
      required: [requestId, apiVersion]
      properties:
        requestId: { type: string }
        apiVersion: { type: string, const: v1 }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
                 METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED,
                 PERMISSION_REQUIRED, UNAVAILABLE, INTERNAL]
        message: { type: string, description: Human-readable; clients branch on code only }
        details: { type: object }
    Health:
      type: object
      required: [status, timestamp, apiVersion]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        apiVersion: { type: string }
    ModuleStatus:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        error: { type: string, description: Set when an enabled module failed to start }
    SystemInfo:
      type: object
      required: [coreVersion, apiVersion, mode, demo, instanceId, instanceCreatedAt,
                 startedAt, uptimeSeconds, schema, modules]
      properties:
        coreVersion: { type: string }
        apiVersion: { type: string }
        mode: { type: string, enum: [development, local, server] }
        demo: { type: boolean, description: True when demo data may be present; clients must label it }
        instanceId: { type: string, format: uuid }
        instanceCreatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, minimum: 0 }
        schema:
          type: array
          items:
            type: object
            required: [module, version]
            properties:
              module: { type: string }
              version: { type: integer, minimum: 1 }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ModuleStatus' }
    SecretRef:
      type: object
      description: Reference to a secret stored outside AER (never the secret itself)
      required: [name, ref]
      properties:
        name: { type: string, pattern: '^[a-z0-9_.-]{1,64}$' }
        ref: { type: string, pattern: '^(env|keyring|file|vault):[A-Za-z0-9_./:@-]{1,256}$', example: 'env:PICO_BOT_TOKEN' }
    Discovery:
      type: string
      enum: [manual, agent, docker, network_scan, import, external]
    RegistryEntity:
      type: object
      required: [id, name, type, description, icon, tags, parentId, discovery, address, secretRefs,
                 attributes, capabilities, revision, createdAt, updatedAt, archived, archivedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, description: 'Id from GET /registry/types' }
        description: { type: string }
        icon: { type: string, description: Visual representation id; defaults to the type icon }
        tags: { type: array, items: { type: string } }
        parentId: { type: [string, 'null'], format: uuid, description: 'Physical parent, e.g. an OS runtime belongs to a computer' }
        discovery: { $ref: '#/components/schemas/Discovery' }
        address: { type: [string, 'null'], description: 'host, host:port, IP or URL; never with credentials' }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/SecretRef' } }
        attributes: { type: object, description: Extensible parameters; secret-looking keys are rejected }
        capabilities: { type: array, items: { type: string }, description: Declared capabilities, not verified ones }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archived: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
    NewRegistryEntity:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
        icon: { type: string }
        tags: { type: array, items: { type: string } }
        parentId: { type: [string, 'null'], format: uuid }
        discovery: { $ref: '#/components/schemas/Discovery' }
        address: { type: [string, 'null'] }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/SecretRef' } }
        attributes: { type: object }
        capabilities: { type: array, items: { type: string }, description: Omit to use the type defaults }
    RegistryEntityPatch:
      type: object
      required: [revision]
      additionalProperties: false
      description: Absent fields are unchanged; parentId/address may be null to clear
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        icon: { type: string }
        tags: { type: array, items: { type: string } }
        parentId: { type: [string, 'null'], format: uuid }
        discovery: { $ref: '#/components/schemas/Discovery' }
        address: { type: [string, 'null'] }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/SecretRef' } }
        attributes: { type: object }
    RegistryEntityPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RegistryEntity' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    RevisionRequest:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
    CapabilitiesRequest:
      type: object
      required: [revision, capabilities]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        capabilities: { type: array, items: { type: string } }
    EntityType:
      type: object
      required: [id, label, description, group, icon, addressMode, defaultCapabilities]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        group: { type: string, enum: [hardware, network, software, virtual] }
        icon: { type: string }
        addressMode: { type: string, enum: [none, optional, required] }
        addressHint: { type: string }
        defaultCapabilities: { type: array, items: { type: string } }
    Capability:
      type: object
      required: [id, label, description, module]
      properties:
        id: { type: string, example: power.wake }
        label: { type: string }
        description: { type: string }
        module: { type: string, description: Module that will execute it }
    RelationKind:
      type: object
      required: [id, label, description, acyclic]
      properties:
        id: { type: string, enum: [runs_on, depends_on, hosted_by, installed_on, connected_to, controls, custom] }
        label: { type: string }
        description: { type: string }
        acyclic: { type: boolean }
    NewRelation:
      type: object
      required: [kind, targetId]
      additionalProperties: false
      properties:
        kind: { type: string }
        targetId: { type: string, format: uuid }
        label: { type: string, description: Required for kind=custom }
    Relation:
      type: object
      required: [id, fromId, toId, kind, label, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromId: { type: string, format: uuid }
        toId: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
    EntitySummary:
      type: object
      required: [id, name, type, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        archived: { type: boolean }
    RelationView:
      type: object
      required: [id, fromId, toId, kind, label, createdAt, direction, peer]
      properties:
        id: { type: string, format: uuid }
        fromId: { type: string, format: uuid }
        toId: { type: string, format: uuid }
        kind: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        direction: { type: string, enum: [outgoing, incoming] }
        peer: { $ref: '#/components/schemas/EntitySummary' }
    SceneSummary:
      type: object
      required: [id, name, schemaVersion, demo, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schemaVersion: { type: integer }
        demo: { type: boolean }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SceneRecord:
      type: object
      required: [id, name, schemaVersion, demo, revision, createdAt, updatedAt, document]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        schemaVersion: { type: integer }
        demo: { type: boolean }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        document: { $ref: 'scene.schema.json' }
    SceneReplaceRequest:
      type: object
      required: [revision, document]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        document: { $ref: 'scene.schema.json' }
    MetricType:
      type: object
      required: [id, label, unit, description, labelKey, key]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        description: { type: string }
        labelKey: { type: string }
        key: { type: boolean }
    MetricValue:
      type: object
      required: [metric, label, value, unit, at, source, quality, reason]
      properties:
        metric: { type: string }
        label: { type: string }
        value: { type: [number, 'null'], description: null when the value is unsupported or unavailable }
        unit: { type: string }
        at: { type: string, format: date-time }
        source: { type: string }
        quality: { type: string, enum: [ok, unsupported, unavailable] }
        reason: { type: string }
    MonitoringStatus: { type: string, enum: [online, degraded, offline, unknown, unsupported] }
    Severity: { type: string, enum: [info, warning, critical] }
    AgentInfo:
      type: object
      properties:
        version: { type: string }
        os: { type: string }
        osVersion: { type: string }
        hostname: { type: string }
        uptimeSec: { type: number }
        collectors: { type: object, additionalProperties: { type: string } }
    BotStatus:
      type: object
      properties:
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastError: { type: string }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        lastRestartAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        apiOk: { type: [boolean, 'null'] }
    Agent:
      type: object
      required: [id, entityId, name, kind, createdAt, revokedAt, lastSeenAt, info, bot, active]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [host, bot] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        info: { oneOf: [{ $ref: '#/components/schemas/AgentInfo' }, { type: 'null' }] }
        bot: { oneOf: [{ $ref: '#/components/schemas/BotStatus' }, { type: 'null' }] }
        active: { type: boolean }
    NewAgent:
      type: object
      required: [entityId, name]
      additionalProperties: false
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [host, bot] }
    CreatedAgent:
      type: object
      required: [agent, token]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        token: { type: string, description: 'aer1.<agentId>.<secret>; shown once, store it in the agent token file' }
    DeviceState:
      type: object
      required: [entityId, name, type, status, reason, checkKind, lastContactAt, lastCheckAt, changedAt, keyMetrics, openIncidents, worstSeverity, agents]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        status: { $ref: '#/components/schemas/MonitoringStatus' }
        reason: { type: string }
        checkKind: { type: string, enum: [agent, heartbeat, http, tcp, docker, none] }
        lastContactAt: { type: [string, 'null'], format: date-time }
        lastCheckAt: { type: [string, 'null'], format: date-time }
        changedAt: { type: [string, 'null'], format: date-time }
        keyMetrics: { type: array, items: { $ref: '#/components/schemas/MetricValue' } }
        openIncidents: { type: integer }
        worstSeverity: { oneOf: [{ $ref: '#/components/schemas/Severity' }, { type: 'null' }] }
        agents: { type: array, items: { $ref: '#/components/schemas/Agent' } }
    MetricPoint:
      type: object
      required: [t, value, min, max]
      properties:
        t: { type: string, format: date-time }
        value: { type: [number, 'null'] }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
    MetricSeries:
      type: object
      required: [entityId, metric, label, unit, from, to, resolution, stepSec, points]
      properties:
        entityId: { type: string }
        metric: { type: string }
        label: { type: string }
        unit: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        resolution: { type: string, enum: [raw, 5m] }
        stepSec: { type: integer }
        points: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } }
    LogLevel: { type: string, enum: [debug, info, warning, error, critical] }
    LogEntry:
      type: object
      required: [id, at, entityId, source, level, message, correlationId, fields, incidentId]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        entityId: { type: [string, 'null'] }
        source: { type: string }
        level: { $ref: '#/components/schemas/LogLevel' }
        message: { type: string, description: secrets are redacted before storage }
        correlationId: { type: string }
        fields: { type: [object, 'null'] }
        incidentId: { type: [string, 'null'] }
    LogPage:
      type: object
      required: [items, nextBefore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        nextBefore: { type: [integer, 'null'] }
    MonitoringEvent:
      type: object
      required: [id, at, entityId, kind, severity, message, incidentId]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        entityId: { type: [string, 'null'] }
        kind: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        message: { type: string }
        incidentId: { type: [string, 'null'] }
    IncidentEvent:
      type: object
      required: [at, kind, message]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [opened, repeated, acknowledged, resolved, note] }
        message: { type: string }
    Incident:
      type: object
      required: [id, key, title, source, entityId, severity, status, openedAt, updatedAt, acknowledgedAt, resolvedAt, cause, related, occurrences, lastMessage]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, description: grouping key; one unresolved incident per key }
        title: { type: string }
        source: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { type: string, enum: [open, acknowledged, resolved] }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        cause: { type: string, description: only from direct evidence; empty when unknown }
        related: { type: array, items: { type: string }, description: correlated incidents (not a cause) }
        occurrences: { type: integer }
        lastMessage: { type: string }
        timeline: { type: array, items: { $ref: '#/components/schemas/IncidentEvent' } }
    IncidentPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        total: { type: integer }
    AcknowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 300 }
    Notification:
      type: object
      required: [id, at, kind, severity, title, body, entityId, incidentId, readAt, telegram]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        kind: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        body: { type: string }
        entityId: { type: [string, 'null'] }
        incidentId: { type: [string, 'null'] }
        readAt: { type: [string, 'null'], format: date-time }
        telegram: { type: string, enum: [disabled, pending, sent, skipped, failed] }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unread: { type: integer }
    MarkReadRequest:
      type: object
      additionalProperties: false
      properties:
        ids: { type: array, items: { type: string } }
    MarkReadResult:
      type: object
      required: [marked]
      properties:
        marked: { type: integer }
    IntegrationStatus:
      type: object
      required: [id, label, status, reason, checkedAt]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, unavailable, disabled] }
        reason: { type: string }
        checkedAt: { type: [string, 'null'], format: date-time }
    MonitoringOverview:
      type: object
      required: [generatedAt, devices, byStatus, openIncidents, criticalOpen, unreadNotifications, integrations, recentEvents]
      properties:
        generatedAt: { type: string, format: date-time }
        devices: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        openIncidents: { type: integer }
        criticalOpen: { type: integer }
        unreadNotifications: { type: integer }
        integrations: { type: array, items: { $ref: '#/components/schemas/IntegrationStatus' } }
        recentEvents: { type: array, items: { $ref: '#/components/schemas/MonitoringEvent' } }
    Container:
      type: object
      required: [id, name, image, state, health, startedAt, finishedAt, exitCode, oomKilled, error, restartCount, changedAt, entityId, cpuPercent, memBytes, lastErrors]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        health: { type: string }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        exitCode: { type: [integer, 'null'] }
        oomKilled: { type: boolean }
        error: { type: string }
        restartCount: { type: integer }
        changedAt: { type: string, format: date-time }
        entityId: { type: [string, 'null'] }
        cpuPercent: { type: [number, 'null'] }
        memBytes: { type: [number, 'null'] }
        lastErrors: { type: array, items: { type: string } }
    ContainerList:
      type: object
      required: [integration, items]
      properties:
        integration: { $ref: '#/components/schemas/IntegrationStatus' }
        items: { type: array, items: { $ref: '#/components/schemas/Container' } }
    AgentSample:
      type: object
      required: [metric, at, quality]
      additionalProperties: false
      properties:
        metric: { type: string, description: id from GET /monitoring/metric-types }
        label: { type: string, maxLength: 120 }
        value: { type: [number, 'null'] }
        at: { type: string, format: date-time }
        quality: { type: string, enum: [ok, unsupported, unavailable] }
        reason: { type: string }
    AgentLog:
      type: object
      required: [at, level, message]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        level: { $ref: '#/components/schemas/LogLevel' }
        source: { type: string, maxLength: 120 }
        message: { type: string }
        correlationId: { type: string, maxLength: 120 }
        fields: { type: object }
    AgentReport:
      type: object
      additionalProperties: false
      properties:
        agent: { $ref: '#/components/schemas/AgentInfo' }
        bot: { $ref: '#/components/schemas/BotStatus' }
        samples: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/AgentSample' } }
        logs: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/AgentLog' } }
        dropped:
          type: object
          properties:
            samples: { type: integer }
            logs: { type: integer }
    ReportResult:
      type: object
      required: [acceptedSamples, acceptedLogs, droppedLogs, serverTime, intervalSec]
      properties:
        acceptedSamples: { type: integer }
        acceptedLogs: { type: integer }
