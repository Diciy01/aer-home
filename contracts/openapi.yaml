        pid: { type: integer }
        since: { type: [string, 'null'], format: date-time }
        reason: { type: string }
    BotJob:
      type: object
      required: [id, entityId, externalId, name, status, source, startedAt, finishedAt, durationMs, result, error, retryable, retryOf]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/BotJobStatus' }
