components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    agentAuth:
      type: http
      scheme: bearer
      description: Per-agent credential (aer1.<agentId>.<secret>) bound to one Registry entity; revocable. Never the owner token.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource or endpoint not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Malformed JSON, unknown fields or oversized body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: "VALIDATION_FAILED; error.details.fields maps field name to a human-readable message"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: "CONFLICT; error.details.reason is revision_mismatch | archived | state | duplicate | cycle, error.details.currentRevision when known"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Entity:
      description: The entity
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/RegistryEntity' }
    Scene:
      description: The scene with its document
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/SceneRecord' }
    EntityTypeList:
      description: Entity types
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EntityType' } }
    CapabilityList:
      description: Capabilities
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    RelationKindList:
      description: Relation kinds
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RelationKind' } }
  schemas:
    Meta:
      type: object
      required: [requestId, apiVersion]
      properties:
        requestId: { type: string }
        apiVersion: { type: string, const: v1 }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
                 METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED,
                 PERMISSION_REQUIRED, UNAVAILABLE, INTERNAL]
        message: { type: string, description: Human-readable; clients branch on code only }
        details: { type: object }
    Health:
      type: object
      required: [status, timestamp, apiVersion]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        apiVersion: { type: string }
    ModuleStatus:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        error: { type: string, description: Set when an enabled module failed to start }
    SystemInfo:
      type: object
      required: [coreVersion, apiVersion, mode, demo, instanceId, instanceCreatedAt,
                 startedAt, uptimeSeconds, schema, modules]
      properties:
        coreVersion: { type: string }
        apiVersion: { type: string }
        mode: { type: string, enum: [development, local, server] }
        demo: { type: boolean, description: True when demo data may be present; clients must label it }
        instanceId: { type: string, format: uuid }
        instanceCreatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, minimum: 0 }
        schema:
          type: array
          items:
            type: object
            required: [module, version]
            properties:
              module: { type: string }
              version: { type: integer, minimum: 1 }
        modules:
          type: array
          items: { $ref: '#/components/schemas/ModuleStatus' }
    SecretRef:
      type: object
      description: Reference to a secret stored outside AER (never the secret itself)
      required: [name, ref]
      properties:
        name: { type: string, pattern: '^[a-z0-9_.-]{1,64}$' }
        ref: { type: string, pattern: '^(env|keyring|file|vault):[A-Za-z0-9_./:@-]{1,256}$', example: 'env:PICO_BOT_TOKEN' }
    Discovery:
      type: string
      enum: [manual, agent, docker, network_scan, import, external]
    RegistryEntity:
      type: object
      required: [id, name, type, description, icon, tags, parentId, discovery, address, secretRefs,
                 attributes, capabilities, revision, createdAt, updatedAt, archived, archivedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, description: 'Id from GET /registry/types' }
        description: { type: string }
        icon: { type: string, description: Visual representation id; defaults to the type icon }
        tags: { type: array, items: { type: string } }
        parentId: { type: [string, 'null'], format: uuid, description: 'Physical parent, e.g. an OS runtime belongs to a computer' }
        discovery: { $ref: '#/components/schemas/Discovery' }
        address: { type: [string, 'null'], description: 'host, host:port, IP or URL; never with credentials' }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/SecretRef' } }
        attributes: { type: object, description: Extensible parameters; secret-looking keys are rejected }
        capabilities: { type: array, items: { type: string }, description: Declared capabilities, not verified ones }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archived: { type: boolean }
        archivedAt: { type: [string, 'null'], format: date-time }
    NewRegistryEntity:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
        icon: { type: string }
        tags: { type: array, items: { type: string } }
        parentId: { type: [string, 'null'], format: uuid }
        discovery: { $ref: '#/components/schemas/Discovery' }
        address: { type: [string, 'null'] }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/SecretRef' } }
        attributes: { type: object }
        capabilities: { type: array, items: { type: string }, description: Omit to use the type defaults }
    RegistryEntityPatch:
      type: object
      required: [revision]
      additionalProperties: false
      description: Absent fields are unchanged; parentId/address may be null to clear
      properties:
        revision: { type: integer, minimum: 1 }
