          type: object
          properties:
            samples: { type: integer }
            logs: { type: integer }
    ReportResult:
      type: object
      required: [acceptedSamples, acceptedLogs, droppedLogs, serverTime, intervalSec]
      properties:
        acceptedSamples: { type: integer }
        acceptedLogs: { type: integer }
        droppedLogs: { type: integer }
        serverTime: { type: string, format: date-time }
        intervalSec: { type: integer }
